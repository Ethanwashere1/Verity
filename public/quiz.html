<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Verity</title>
    <link rel="stylesheet" href="index.css">
    <script defer src="main.js"></script>
    <script defer src="quiz.js"></script>

    <header>
        <div class="nav-bar">
            <div class="logo">
                <!-- logo image or text here -->
                <a href="index.html">Verity</a>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="tutorial.html">Tutorials</a></li>
                    <li><a href="game.html">Game</a></li>
                    <li><a href="quiz.html">Quiz</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <body class="quiz-page">
        <!-- start screen -->
        <div id="start-screen" class="quiz-screen">
            <h2>AI Literacy Quiz</h2>
            <p>Test your knowledge of AI concepts and applications.</p>
            <div class="quiz-button-center">
                <button id="start-button">Start Quiz</button>
            </div>
        </div>

        <!-- quiz container -->
        <div id="quiz-screen" class="quiz-screen" style="display:none;">
            <div id="question-container">
                <p id="question-number">Question Number</p>
                <p id="question-text">Question Text Goes Here</p>
                <div id="answers">
                    <!-- radio inputs inserted dynamically -->
                </div>
            </div>
            <div class="quiz-nav">
                <button id="prev-button" disabled>Previous</button>
                <button id="next-button">Next</button>
                <button id="submit-button" style="display:none;">Submit</button>
            </div>
        </div>

        <!-- results screen -->
        <div id="results-screen" class="quiz-screen" style="display:none;">
            <h2>Results</h2>
            <p id="score-text"></p>
            <p id="pass-text"></p>
        </div>
    </body>
</html>
